# The pages a demo results list is made from. Nothing here is fetched: the app
# never calls a search API. For each phrase, DemoSearch orders these entries by
# `rank` plus a jitter seeded from the phrase, keeps the first 64, and fills in
# the placeholders, so one phrase always gives the same list.
#
# Fields
#   url      the address shown; placeholders below
#   title    the blue headline
#   snippet  the two grey lines under it
#   rank     where the page tends to land: 0.0 is the top of page one, 1.0 the
#            bottom of the list (the jitter moves it by up to 0.35)
#
# Placeholders (every one is derived from the phrase, never from the site)
#   %{phrase}  the phrase as searched, lower case     "cyvasse game"
#   %{Title}   Title Case                             "Cyvasse Game"
#   %{slug}    hyphen-joined ASCII words              "cyvasse-game"
#   %{joined}  ASCII words with no separator          "cyvassegame"
#   %{plus}    plus-joined, for search pages          "cyvasse+game"
#   %{under}   Wiki_Style                             "Cyvasse_game"
#   %{word}    the longest ASCII word                 "cyvasse"
#   %{id}      a short id seeded from the phrase      "k3x9q2ma"
#   %{n}       a number from 2 to 9, seeded           "5"
#
# Real sites appear here only as the kind of page each tends to have; the
# paths are invented, which is why the page does not link to them. Invented
# domains are built from the phrase and are equally fictional.

